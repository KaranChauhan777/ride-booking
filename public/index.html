<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Distributed Ride-Booking System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0A0E14;
    --surface: #121821;
    --surface-2: #1A2129;
    --border: #232B36;
    --text: #E6EDF3;
    --text-muted: #7C8A9A;
    --teal: #4FD1C5;
    --amber: #F5A623;
    --green: #34D399;
    --red: #FB7185;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    background-image:
      radial-gradient(circle at 20% 20%, rgba(79, 209, 197, 0.04), transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(245, 166, 35, 0.03), transparent 40%);
  }

  .wrap {
    max-width: 1200px;
    margin: 0 auto;
    padding: 32px 24px 80px;
  }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 40px;
    flex-wrap: wrap;
    gap: 12px;
  }

  .brand {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 18px;
    letter-spacing: -0.02em;
  }
  .brand span { color: var(--teal); }

  .tagline {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text-muted);
  }

  .grid {
    display: grid;
    grid-template-columns: 340px 1fr;
    gap: 24px;
  }

  @media (max-width: 860px) {
    .grid { grid-template-columns: 1fr; }
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
  }

  .panel-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    margin-bottom: 16px;
  }

  /* --- Booking panel --- */
  .book-btn {
    width: 100%;
    padding: 18px;
    background: var(--teal);
    color: #06141A;
    border: none;
    border-radius: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.02em;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    margin-bottom: 20px;
  }
  .book-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(79, 209, 197, 0.25); }
  .book-btn:active { transform: translateY(0); }
  .book-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }

  .result-box {
    min-height: 64px;
    border: 1px dashed var(--border);
    border-radius: 8px;
    padding: 14px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    transition: border-color 0.2s ease;
  }
  .result-box.success { border-color: var(--green); color: var(--green); border-style: solid; }
  .result-box.fail { border-color: var(--red); color: var(--red); border-style: solid; }

  .stats-row {
    display: flex;
    gap: 16px;
    margin-top: 24px;
  }
  .stat {
    flex: 1;
    background: var(--surface-2);
    border-radius: 8px;
    padding: 14px 12px;
  }
  .stat-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    font-weight: 700;
    color: var(--teal);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .stat-label {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 2px;
  }

  /* --- Log feed --- */
  .log-feed {
    margin-top: 20px;
    height: 160px;
    overflow-y: auto;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    line-height: 1.9;
    color: var(--text-muted);
  }
  .log-feed div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .log-feed .new { color: var(--teal); }

  /* --- Topology panel --- */
  #topology { width: 100%; height: 440px; display: block; }

  .node-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    fill: var(--text-muted);
  }
  .node-sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    fill: var(--text-muted);
    opacity: 0.7;
  }

  .legend {
    display: flex;
    gap: 20px;
    margin-top: 16px;
    flex-wrap: wrap;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    color: var(--text-muted);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; }

  footer {
    margin-top: 40px;
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
  }
  footer a { color: var(--teal); text-decoration: none; }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div>
      <div class="brand">ride<span>//</span>system</div>
      <div class="tagline">distributed ride-booking · live topology</div>
    </div>
    <div class="tagline" id="clock">—</div>
  </header>

  <div class="grid">
    <!-- LEFT: Booking panel -->
    <div class="panel">
      <div class="panel-label">Request a ride</div>
      <button class="book-btn" id="bookBtn" onclick="requestRide()">▶ REQUEST_RIDE()</button>
      <div class="result-box" id="resultBox">Waiting for request…</div>

      <div class="stats-row">
        <div class="stat">
          <div class="stat-num" id="totalRides">0</div>
          <div class="stat-label">Total rides</div>
        </div>
        <div class="stat">
          <div class="stat-num" id="leaderName">—</div>
          <div class="stat-label">Active leader</div>
        </div>
      </div>

      <div class="panel-label" style="margin-top: 24px;">Event log</div>
      <div class="log-feed" id="logFeed"></div>
    </div>

    <!-- RIGHT: Topology -->
    <div class="panel">
      <div class="panel-label">System topology — live</div>
      <svg id="topology" viewBox="0 0 720 440"></svg>
      <div class="legend">
        <div class="legend-item"><div class="dot" style="background:var(--amber)"></div> Leader</div>
        <div class="legend-item"><div class="dot" style="background:var(--text-muted)"></div> Standby</div>
        <div class="legend-item"><div class="dot" style="background:var(--green)"></div> Driver free</div>
        <div class="legend-item"><div class="dot" style="background:var(--red)"></div> Driver busy / down</div>
        <div class="legend-item"><div class="dot" style="background:var(--teal)"></div> Active request path</div>
      </div>
    </div>
  </div>

  <footer>built to learn distributed systems by breaking them · <a href="https://github.com" target="_blank">view source</a></footer>
</div>

<script>
const NS = "http://www.w3.org/2000/svg";

// ---- Node layout (fixed positions) ----
const nodes = {
  lb:   { x: 360, y: 50,  label: "LOAD BALANCER", sub: ":5000", r: 26 },
  m1:   { x: 200, y: 180, label: "main-server-1",  sub: ":3000", r: 24 },
  m2:   { x: 520, y: 180, label: "main-server-2",  sub: ":3001", r: 24 },
  d1:   { x: 130, y: 340, label: "Driver-1",       sub: ":4001", r: 20 },
  d2:   { x: 360, y: 340, label: "Driver-2",       sub: ":4002", r: 20 },
  d3:   { x: 590, y: 340, label: "Driver-3",       sub: ":4003", r: 20 },
};

const edges = [
  ["lb", "m1"], ["lb", "m2"],
  ["m1", "d1"], ["m1", "d2"], ["m1", "d3"],
  ["m2", "d1"], ["m2", "d2"], ["m2", "d3"],
];

const svg = document.getElementById("topology");

function el(tag, attrs) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

// draw static edges once
const edgeEls = {};
edges.forEach(([a, b]) => {
  const line = el("line", {
    x1: nodes[a].x, y1: nodes[a].y, x2: nodes[b].x, y2: nodes[b].y,
    stroke: "#232B36", "stroke-width": 1.5
  });
  svg.appendChild(line);
  edgeEls[a + "-" + b] = line;
});

// draw nodes
const nodeEls = {};
Object.entries(nodes).forEach(([key, n]) => {
  const g = el("g", {});
  const circle = el("circle", { cx: n.x, cy: n.y, r: n.r, fill: "#1A2129", stroke: "#232B36", "stroke-width": 2 });
  const label = el("text", { x: n.x, y: n.y + n.r + 16, "text-anchor": "middle", class: "node-label" });
  label.textContent = n.label;
  const sub = el("text", { x: n.x, y: n.y + n.r + 28, "text-anchor": "middle", class: "node-sub" });
  sub.textContent = n.sub;
  g.appendChild(circle);
  g.appendChild(label);
  g.appendChild(sub);
  svg.appendChild(g);
  nodeEls[key] = circle;
});

function setNodeColor(key, color, glow) {
  nodeEls[key].setAttribute("stroke", color);
  nodeEls[key].setAttribute("stroke-width", glow ? 3 : 2);
  nodeEls[key].style.filter = glow ? `drop-shadow(0 0 6px ${color})` : "none";
}

function pulseEdge(a, b) {
  const line = edgeEls[a + "-" + b] || edgeEls[b + "-" + a];
  if (!line) return;
  line.setAttribute("stroke", "#4FD1C5");
  line.setAttribute("stroke-width", 2.5);
  setTimeout(() => {
    line.setAttribute("stroke", "#232B36");
    line.setAttribute("stroke-width", 1.5);
  }, 900);
}

// ---- Live status polling ----
let lastKnownLeader = null;
let lastKnownLeaderTime = 0;

async function pollStatus() {
  try {
    const res = await fetch('/system-status');
    const data = await res.json();

    document.getElementById("totalRides").textContent = data.totalRides;
    const now = Date.now();

    if (data.leader) {
      document.getElementById("leaderName").textContent = data.leader.replace('main-', '');
      lastKnownLeader = data.leader;
      lastKnownLeaderTime = now;
    } else if (lastKnownLeader && (now - lastKnownLeaderTime) < 4000) {
      // sirf 4 second tak purana leader dikhao (naya election chal raha ho sakta hai)
      document.getElementById("leaderName").textContent = lastKnownLeader.replace('main-', '') + " (electing…)";
    } else {
      // 4 second se zyada ho gaye, ab sach dikhao - koi leader nahi hai
      document.getElementById("leaderName").textContent = "no leader";
      lastKnownLeader = null;
    }

    const effectiveLeader = (now - lastKnownLeaderTime) < 4000 ? (data.leader || lastKnownLeader) : data.leader;
    setNodeColor("m1", effectiveLeader === "main-server-1" ? "#F5A623" : "#7C8A9A", effectiveLeader === "main-server-1");
    setNodeColor("m2", effectiveLeader === "main-server-2" ? "#F5A623" : "#7C8A9A", effectiveLeader === "main-server-2");

    const driverKeys = { "Driver-1": "d1", "Driver-2": "d2", "Driver-3": "d3" };
    data.drivers.forEach(d => {
      const key = driverKeys[d.name];
      if (!d.alive) setNodeColor(key, "#FB7185", false);
      else setNodeColor(key, d.free ? "#34D399" : "#FB7185", false);
    });
  } catch (err) {
    // system down, ignore silently on dashboard
  }
}
pollStatus();
setInterval(pollStatus, 1500);

// ---- Booking action ----
function logLine(text, isNew) {
  const feed = document.getElementById("logFeed");
  const line = document.createElement("div");
  if (isNew) line.className = "new";
  line.textContent = text;
  feed.prepend(line);
  while (feed.children.length > 12) feed.removeChild(feed.lastChild);
}

async function requestRide() {
  const btn = document.getElementById("bookBtn");
  const box = document.getElementById("resultBox");
  btn.disabled = true;
  box.className = "result-box";
  box.textContent = "Routing request…";

  pulseEdge("lb", "m1");
  pulseEdge("lb", "m2");

  try {
    const res = await fetch('/request-ride');
    const data = await res.json();

    if (res.ok) {
      box.className = "result-box success";
      box.textContent = "✓ " + data.message;
      logLine(new Date().toLocaleTimeString() + "  " + data.message, true);

      // figure out which driver, pulse that edge too
      const match = data.message.match(/Driver-\d/);
      if (match) {
        const dKey = { "Driver-1": "d1", "Driver-2": "d2", "Driver-3": "d3" }[match[0]];
        pulseEdge("m1", dKey);
        pulseEdge("m2", dKey);
      }
    } else {
      box.className = "result-box fail";
      box.textContent = "✕ " + data.message;
      logLine(new Date().toLocaleTimeString() + "  " + data.message, false);
    }
  } catch (err) {
    box.className = "result-box fail";
    box.textContent = "✕ Could not reach load balancer";
  }

  setTimeout(() => { btn.disabled = false; }, 400);
}

// clock
setInterval(() => {
  document.getElementById("clock").textContent = new Date().toLocaleTimeString();
}, 1000);
</script>

</body>
</html>
